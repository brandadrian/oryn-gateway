services:
  ollama-api:
    image: nginx:alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      # nginx ersetzt ${OLLAMA_API_KEY} beim Start und schreibt nach conf.d/default.conf
      - ./templates:/etc/nginx/templates:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - traefik.enable=true
      - traefik.http.routers.ollama-api.rule=Host(`ollama.homelab.brandadrian.com`)
      - traefik.http.routers.ollama-api.entrypoints=websecure
      - traefik.http.routers.ollama-api.tls.certresolver=le
      - traefik.http.routers.ollama-api.service=ollama-api
      # lokal testen: https://ollama.localhost (selbstsigniertes Zertifikat, kein Let's Encrypt)
      - traefik.http.routers.ollama-api-local.rule=Host(`ollama.localhost`)
      - traefik.http.routers.ollama-api-local.entrypoints=websecure
      - traefik.http.routers.ollama-api-local.tls=true
      - traefik.http.routers.ollama-api-local.service=ollama-api
      - traefik.http.services.ollama-api.loadbalancer.server.port=80
    networks:
      - proxy

networks:
  proxy:
    external: true
