# oryn-gateway: Traefik als Reverse Proxy für alle Apps (oryn-ai-portal, Shopware-Launcher, Beispiel-Apps).
# Start (im Hauptordner):  docker compose up -d
# Die Apps hängen am externen Docker-Netz "proxy" (einmalig: docker network create proxy)
# und bringen ihre Routing-Regeln als Labels selbst mit.
name: oryn-gateway

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=brandadrian@gmail.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Zertifikate (acme.json), nicht im Git
      - ./traefik/letsencrypt:/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    external: true
