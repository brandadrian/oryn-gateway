services:
  whoami:
    image: traefik/whoami
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.oryn.brandadrian.com`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls.certresolver=le
      - traefik.http.routers.whoami.service=whoami
      # lokal testen: https://whoami.localhost (selbstsigniertes Zertifikat, kein Let's Encrypt)
      - traefik.http.routers.whoami-local.rule=Host(`whoami.localhost`)
      - traefik.http.routers.whoami-local.entrypoints=websecure
      - traefik.http.routers.whoami-local.tls=true
      - traefik.http.routers.whoami-local.service=whoami
      - traefik.http.services.whoami.loadbalancer.server.port=80
    networks:
      - proxy

networks:
  proxy:
    external: true
