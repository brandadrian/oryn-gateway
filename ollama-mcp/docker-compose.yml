services:
  # Eigener Zugang fuer MCP-Agenten (Copilot): gleiche Key-Pruefung wie ollama-api, aber ueber den think-proxy
  ollama-mcp:
    image: nginx:alpine
    restart: unless-stopped
    # gleicher Key wie ollama-api (keine Kopie des Secrets)
    env_file: ../ollama-api/.env
    volumes:
      # nginx ersetzt ${OLLAMA_API_KEY} beim Start und schreibt nach conf.d/default.conf
      - ./templates:/etc/nginx/templates:ro
    depends_on:
      - ollama-mcp-think
    labels:
      - traefik.enable=true
      - traefik.http.routers.ollama-mcp.rule=Host(`ollama-mcp.homelab.brandadrian.com`)
      - traefik.http.routers.ollama-mcp.entrypoints=websecure
      - traefik.http.routers.ollama-mcp.tls.certresolver=le
      - traefik.http.routers.ollama-mcp.service=ollama-mcp
      # lokal testen: https://ollama-mcp.localhost (selbstsigniertes Zertifikat, kein Let's Encrypt)
      - traefik.http.routers.ollama-mcp-local.rule=Host(`ollama-mcp.localhost`)
      - traefik.http.routers.ollama-mcp-local.entrypoints=websecure
      - traefik.http.routers.ollama-mcp-local.tls=true
      - traefik.http.routers.ollama-mcp-local.service=ollama-mcp
      - traefik.http.services.ollama-mcp.loadbalancer.server.port=80
    networks:
      - proxy

  # Schaltet Thinking fuer die Modelle in NO_THINK_MODELS ab (Copilot kann das nicht selbst), alles andere geht unveraendert durch
  ollama-mcp-think:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - NO_THINK_MODELS=qwen3.5-mcp
    volumes:
      - ./think-proxy:/app:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy

networks:
  proxy:
    external: true
