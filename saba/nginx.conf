# Begrenzung gegen Missbrauch (gilt global, da alle Anfragen über Traefik kommen)
limit_req_zone $server_name zone=chat:1m rate=30r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html =404;
    }

    # Nur dieser eine Ollama-Endpunkt ist erreichbar (kein pull, delete, ...)
    location = /api/chat {
        limit_except POST { deny all; }
        limit_req zone=chat burst=10 nodelay;
        client_max_body_size 64k;

        proxy_pass http://host.docker.internal:11434/api/chat;
        proxy_set_header Host localhost;
        proxy_set_header Origin "";       # Ollama blockt fremde Origins
        proxy_http_version 1.1;
        proxy_buffering off;              # Antwort live streamen
        proxy_read_timeout 300s;
    }
}
