<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saba</title>
<link rel="icon" href="saba.png">
<style>
  /* Alter Jugo-/Balkan-Stil: Kafana, Holzvertäfelung, Häkeldeckchen, Emailschild */
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    font-family: "Courier New", Courier, monospace; color: #2b1d12;
    /* Holzvertäfelung */
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 90px),
      repeating-linear-gradient(90deg, #6b4226 0 30px, #7a4d2c 30px 55px, #5e3a21 55px 90px);
  }
  .top { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 12px auto 6px; }
  /* Porträt wie das alte Foto an der Kafana-Wand */
  .portrait {
    width: 92px; height: 112px; object-fit: cover; border-radius: 50%;
    border: 5px solid #c9a227; outline: 3px solid #5e3a21;
    box-shadow: 0 6px 14px rgba(0,0,0,.6); filter: sepia(.35) contrast(1.05);
    transform: rotate(-3deg);
  }
  header {
    margin: 0; padding: 10px 28px; text-align: center;
    background: #f3ead2; border: 4px solid #1f3f8f; border-radius: 10px;
    box-shadow: 0 0 0 4px #f3ead2, 0 0 0 7px #c8102e, 0 6px 14px rgba(0,0,0,.5);
    position: relative;
  }
  header h1 {
    margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.8rem;
    letter-spacing: .25em; color: #c8102e; text-transform: uppercase;
  }
  header small { display: block; color: #1f3f8f; letter-spacing: .2em; font-size: .75rem; }
  header button {
    position: absolute; right: -10px; top: -10px; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid #f3ead2; background: #c8102e; color: #f3ead2; font-weight: bold; cursor: pointer;
    box-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  /* Tischtuch mit Häkeldeckchen */
  #log {
    flex: 1; overflow-y: auto; margin: 8px 12px; padding: 20px; border-radius: 6px;
    display: flex; flex-direction: column; gap: 12px;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.9) 0 3px, transparent 4px) 0 0/22px 22px,
      radial-gradient(circle at 50% 50%, transparent 0 6px, rgba(255,255,255,.55) 7px 8px, transparent 9px) 11px 11px/22px 22px,
      #e9dfc6;
    border: 3px dashed #fffaf0; outline: 6px solid #e9dfc6;
    box-shadow: inset 0 0 40px rgba(120,80,40,.35), 0 6px 18px rgba(0,0,0,.5);
  }
  .msg {
    max-width: 75%; padding: 10px 14px; white-space: pre-wrap; line-height: 1.45;
    box-shadow: 2px 3px 0 rgba(0,0,0,.25);
  }
  .user { align-self: flex-end; background: #1f3f8f; color: #fffaf0; border-radius: 12px 12px 2px 12px; }
  /* Saba: wie ein Zettel aus der Schreibmaschine */
  .row { align-self: flex-start; display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
  .row .msg { max-width: 100%; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none;
            border: 2px solid #c9a227; filter: sepia(.35); box-shadow: 1px 2px 0 rgba(0,0,0,.3); }
  .bot  { background: #fffdf5; border: 1px solid #c9b98f;
          border-left: 5px solid #c8102e; border-radius: 2px; transform: rotate(-.3deg); }
  .err  { align-self: center; color: #c8102e; font-weight: bold; background: #fffdf5; padding: 4px 10px; }
  form {
    display: flex; gap: 8px; padding: 12px; margin: 0 12px 12px;
    background: #3b2414; border: 3px solid #c9a227; border-radius: 6px;
  }
  textarea {
    flex: 1; resize: none; padding: 10px; height: 46px; font: inherit;
    background: #fffdf5; border: 2px inset #c9b98f; color: #2b1d12;
  }
  form button {
    padding: 0 18px; font: bold 1rem Georgia, serif; letter-spacing: .1em; text-transform: uppercase;
    color: #f3ead2; background: linear-gradient(#d6283f, #9e0b22); border: 2px solid #c9a227;
    border-radius: 4px; cursor: pointer; box-shadow: 0 3px 0 #5e0614;
  }
  form button:active { transform: translateY(2px); box-shadow: 0 1px 0 #5e0614; }
  form button:disabled { opacity: .5; cursor: default; }
  /* Handy: Header passt in die Breite, nichts ragt links/rechts raus */
  @media (max-width: 600px) {
    .top { gap: 10px; margin: 12px 14px 4px; }
    .portrait { width: 62px; height: 76px; border-width: 3px; outline-width: 2px; }
    header { flex: 1; min-width: 0; padding: 8px 10px; }
    header h1 { font-size: 1.25rem; letter-spacing: .12em; white-space: nowrap; }
    header small { font-size: .6rem; letter-spacing: .08em; }
    header button { right: -6px; top: -8px; width: 28px; height: 28px; font-size: .8rem; }
    #log { margin: 8px; padding: 12px; }
    .msg { max-width: 85%; }
    .row { max-width: 92%; }
    form { margin: 0 8px 8px; padding: 8px; }
    form button { padding: 0 12px; }
  }
  /* Tipp-Animation */
  .dots { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: #c8102e; opacity: .3;
               animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
</style>
</head>
<body>
<div class="top">
<img class="portrait" src="saba.png" alt="Saba">
<header>
  <h1>★ Saba ★</h1>
  <small>KAFANA · ЧАТ · SEIT 1983</small>
  <button id="reset" title="Neuer Chat">↺</button>
</header>
</div>
<div id="log"></div>
<form id="form">
  <textarea id="input" placeholder="Kjhenrolle…" autofocus></textarea>
  <button id="send">Pošalji</button>
</form>

<script>
  const MODEL = 'saba';        // Ollama-Modell (aus Modelfile.saba)
  const MAX_HISTORY = 40;      // die letzten 40 Nachrichten (20 Hin und Her) gehen als Kontext mit

  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  // Verlauf im Browser speichern, damit er nach Neuladen noch da ist
  let history = JSON.parse(localStorage.getItem('saba-history') || '[]');
  const save = () => localStorage.setItem('saba-history', JSON.stringify(history));

  function bubble(cls, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;           // textContent: kein HTML/XSS
    if (cls === 'bot') {              // Saba-Nachricht mit Bild
      const row = document.createElement('div');
      row.className = 'row';
      const img = document.createElement('img');
      img.className = 'avatar'; img.src = 'saba.png'; img.alt = 'Saba';
      row.append(img, div);
      log.appendChild(row);
    } else {
      log.appendChild(div);
    }
    log.scrollTop = log.scrollHeight;
    return div;
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const rand = (min, max) => min + Math.random() * (max - min);

  // "Saba schreibt..." mit Punkte-Animation
  const typing = document.createElement('div');
  typing.className = 'row typing';
  typing.innerHTML = '<img class="avatar" src="saba.png" alt=""><div class="msg bot dots"><span></span><span></span><span></span></div>';
  let run = 0;                              // erhöht bei Fehler/Reset -> laufende Simulation stoppt
  function showTyping(id) { if (id !== run) return; log.appendChild(typing); log.scrollTop = log.scrollHeight; }
  function hideTyping() { typing.remove(); }

  // Wie ein Mensch: kurz lesen, tippen, abbrechen, nochmals tippen ...
  async function simulateTyping() {
    const id = run;
    await sleep(rand(800, 1800));           // Nachricht "lesen"
    showTyping(id);
    await sleep(rand(1500, 3000));
    let retries = Math.random() < 0.6 ? 1 : 0;
    if (Math.random() < 0.2) retries++;
    for (let i = 0; i < retries; i++) {    // schreibt doch nicht ... dann doch
      hideTyping();
      await sleep(rand(1000, 3000));
      showTyping(id);
      await sleep(rand(1000, 2500));
    }
  }

  async function fetchAnswer() {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, messages: history, stream: false })
    });
    if (!res.ok) {
      if (res.status === 429) throw new Error('Zu viele Anfragen, kurz warten.');
      const body = await res.text();  // Ollama liefert {"error": "..."}
      let detail = body;
      try { detail = JSON.parse(body).error ?? body; } catch {}
      throw new Error('Fehler ' + res.status + ': ' + detail.slice(0, 300));
    }
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return (data.message?.content ?? '').trim();
  }

  // Antwort in einzelne Nachrichten aufteilen (max. 3)
  function splitParts(answer) {
    const parts = answer.split('\n').map((l) => l.trim()).filter(Boolean);
    if (parts.length === 0) return ['prc'];
    if (parts.length > 3) return [...parts.slice(0, 2), parts.slice(2).join(' ')];
    return parts;
  }

  async function ask(text) {
    history.push({ role: 'user', content: text });
    history = history.slice(-MAX_HISTORY);
    bubble('user', text);
    const id = run;
    try {
      // Antwort holen und Tippen simulieren laufen parallel
      const [answer] = await Promise.all([fetchAnswer(), simulateTyping()]);
      if (id !== run) return;                 // inzwischen "Neu" geklickt
      // Mehrere Zeilen = mehrere Nachrichten, dazwischen wieder kurz "tippen"
      const parts = splitParts(answer);
      for (let i = 0; i < parts.length; i++) {
        if (i > 0) {
          showTyping(id);
          await sleep(rand(1200, 2800));
          if (id !== run) return;
        }
        hideTyping();
        bubble('bot', parts[i]);
      }
      history.push({ role: 'assistant', content: answer });
      save();
    } catch (err) {
      run++;
      hideTyping();
      throw err;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = '';
    send.disabled = true;
    try {
      await ask(text);
    } catch (err) {
      history.pop();
      bubble('err', 'Joj, Problem: ' + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  // gespeicherten Verlauf anzeigen
  for (const m of history) {
    if (m.role === 'user') bubble('user', m.content);
    else splitParts(m.content).forEach((part) => bubble('bot', part));
  }

  // Enter = senden, Shift+Enter = neue Zeile
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  document.getElementById('reset').addEventListener('click', () => {
    history = [];
    save();
    run++;
    hideTyping();
    log.innerHTML = '';
    input.focus();
  });
</script>
</body>
</html>
